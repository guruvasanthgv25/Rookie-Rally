<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rookie Rally Tournament — Tournament Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court-deep:#0B3D2E;
    --court-panel:#0F4A38;
    --court-line:#F7F4EC;
    --cream:#F7F4EC;
    --ink:#0E1A15;
    --smash:#E85D3D;
    --smash-dark:#C94A2C;
    --gold:#D4A72C;
    --muted:#9FCBB8;
    --danger:#C94A2C;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--court-deep);
    background-image:
      repeating-linear-gradient(0deg, rgba(247,244,236,0.035) 0px, rgba(247,244,236,0.035) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, rgba(247,244,236,0.035) 0px, rgba(247,244,236,0.035) 1px, transparent 1px, transparent 64px);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:0.5px;}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  #app{max-width:980px; margin:0 auto; padding:20px 16px 80px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 20px; border-radius:var(--radius);
    background:linear-gradient(135deg, var(--court-panel), var(--court-deep));
    border:1px solid rgba(247,244,236,0.12);
    margin-bottom:18px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{
    width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--court-line) 40%, var(--muted) 100%);
    position:relative; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(247,244,236,0.15);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark svg{ width:26px; height:26px; }
  .brand h1{font-size:22px; margin:0; text-transform:uppercase;}
  .brand p{margin:2px 0 0; font-size:12px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;}

  .admin-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; padding:6px 12px; border-radius:999px;
    background:rgba(247,244,236,0.08); border:1px solid rgba(247,244,236,0.18);
    text-transform:uppercase; letter-spacing:0.8px;
  }
  .pill.on{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}

  button, .btn{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:10px; border:1px solid rgba(247,244,236,0.25);
    background:rgba(247,244,236,0.06); color:var(--cream); cursor:pointer;
    transition:all .15s ease;
  }
  button:hover{background:rgba(247,244,236,0.14);}
  button.primary{background:var(--smash); border-color:var(--smash); color:#fff;}
  button.primary:hover{background:var(--smash-dark);}
  button.gold{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  button.ghost{background:transparent;}
  button.small{padding:5px 10px; font-size:12px;}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  input, textarea, select{
    font-family:'Work Sans', sans-serif; font-size:14px;
    background:rgba(247,244,236,0.06); border:1px solid rgba(247,244,236,0.25);
    color:var(--cream); border-radius:8px; padding:8px 10px; width:100%;
  }
  input::placeholder, textarea::placeholder{color:rgba(247,244,236,0.45);}
  input:focus, textarea:focus, select:focus, button:focus-visible{
    outline:2px solid var(--gold); outline-offset:1px;
  }
  label{font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); display:block; margin-bottom:4px;}

  nav.tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  nav.tabs button{
    background:rgba(247,244,236,0.04); border-radius:999px; padding:8px 16px;
    text-transform:uppercase; font-size:12px; letter-spacing:0.8px;
  }
  nav.tabs button.active{background:var(--cream); color:var(--court-deep); border-color:var(--cream);}

  .card{
    background:var(--court-panel); border:1px solid rgba(247,244,236,0.12);
    border-radius:var(--radius); padding:18px; margin-bottom:16px;
  }
  .card h2{font-size:16px; margin:0 0 12px; text-transform:uppercase; letter-spacing:0.6px; display:flex; align-items:center; gap:8px;}
  .card h2 .eyebrow{color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:12px;}
  .empty{color:var(--muted); font-size:14px; padding:12px 0;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:600px){ .grid-2{grid-template-columns:1fr;} }

  .team-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 0; border-bottom:1px solid rgba(247,244,236,0.08);
    gap:10px;
  }
  .team-row:last-child{border-bottom:none;}
  .team-name{font-weight:700;}
  .team-members{font-size:12px; color:var(--muted); margin-top:2px;}

  .opt-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .opt-btn{
    background:rgba(247,244,236,0.04); border:1px solid rgba(247,244,236,0.2);
    border-radius:10px; padding:10px 14px; text-align:left; cursor:pointer; min-width:140px;
  }
  .opt-btn.selected{border-color:var(--gold); background:rgba(212,167,44,0.12);}
  .opt-big{font-family:'Anton',sans-serif; font-size:22px;}
  .opt-sub{font-size:11px; color:var(--muted); text-transform:uppercase;}

  .group-block{margin-bottom:22px;}
  .group-title{font-family:'Anton',sans-serif; font-size:15px; letter-spacing:0.5px; color:var(--gold); margin-bottom:8px; text-transform:uppercase;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:7px 8px; text-align:left; border-bottom:1px solid rgba(247,244,236,0.08);}
  th{color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;}
  tr.leader td{color:var(--gold); font-weight:700;}

  .match{
    background:rgba(0,0,0,0.15); border:1px solid rgba(247,244,236,0.1);
    border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .match-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .versus{display:flex; align-items:center; gap:10px; flex:1; min-width:220px;}
  .team-chip{
    padding:6px 12px; border-radius:8px; background:rgba(247,244,236,0.06);
    font-weight:700; font-size:14px; min-width:90px; text-align:center;
  }
  .team-chip.tbd{color:var(--muted); font-weight:400; font-style:italic;}
  .team-chip.win{background:var(--gold); color:var(--ink);}
  .team-chip.tappable{
    cursor:pointer; border:1px solid rgba(212,167,44,0.35); user-select:none;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .team-chip.tappable:hover{ background:rgba(212,167,44,0.16); border-color:var(--gold); }
  .team-chip.tappable:active{ transform:scale(0.94); background:rgba(212,167,44,0.28); }
  .vs-txt{color:var(--muted); font-size:11px; text-transform:uppercase;}
  .score-mono{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700;}
  .live-hint{font-size:11px; color:var(--gold); margin-top:6px;}

  /* Big tap-to-score buttons (umpire view) */
  .live-score{display:flex; align-items:center; justify-content:center; gap:18px; margin:18px 0; flex-wrap:wrap;}
  .live-tap{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:rgba(247,244,236,0.06); border:2px solid rgba(247,244,236,0.25);
    border-radius:16px; padding:22px 28px; cursor:pointer; min-width:150px;
    font-family:'Work Sans', sans-serif; color:var(--cream);
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .live-tap:hover{ background:rgba(212,167,44,0.14); border-color:var(--gold); }
  .live-tap:active{ transform:scale(0.95); background:rgba(212,167,44,0.26); }
  .live-name{font-size:13px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); font-weight:700; text-align:center;}
  .live-num{font-family:'Anton',sans-serif; font-size:58px; line-height:1; color:var(--cream);}
  .live-tap-hint{font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:0.5px;}
  .live-vs{color:var(--muted); font-size:13px; text-transform:uppercase;}
  .match-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .score-edit{display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .score-edit input{width:70px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:16px;}
  .winner-tag{
    font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--gold);
    font-weight:700; display:flex; align-items:center; gap:4px;
  }
  .toss-note{font-size:11px; color:var(--muted); margin-top:6px;}

  /* Coin toss */
  .coin-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 0;}
  .coin-scene{perspective:800px;}
  .coin{
    width:110px; height:110px; position:relative; transform-style:preserve-3d;
    transition:transform 2.2s cubic-bezier(.2,.9,.25,1);
  }
  .coin.flip{ transform:rotateY(1800deg); }
  .coin.flip.tails{ transform:rotateY(1980deg); }
  .coin-face{
    position:absolute; inset:0; border-radius:50%; backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    border:3px solid #8a6d1a; font-family:'Anton',sans-serif;
  }
  .coin-face.heads{ background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold) 70%); color:#5a4310; }
  .coin-face.tails{ background:radial-gradient(circle at 35% 30%, #fff8e6, #e8c766 70%); color:#5a4310; transform:rotateY(180deg); }
  .coin-face .big{font-size:26px; line-height:1;}
  .coin-face .small{font-size:9px; letter-spacing:1px; margin-top:2px;}
  .toss-result{font-family:'Anton',sans-serif; font-size:18px; color:var(--gold); min-height:24px;}

  /* Bracket */
  .bracket{display:flex; gap:26px; overflow-x:auto; padding:6px 2px 16px;}
  .bracket-round{display:flex; flex-direction:column; justify-content:space-around; gap:16px; min-width:190px;}
  .bracket-round h3{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin:0 0 4px;}
  .bmatch{background:rgba(0,0,0,0.18); border:1px solid rgba(247,244,236,0.12); border-radius:10px; padding:8px 10px;}
  .bmatch .bteam{display:flex; justify-content:space-between; font-size:13px; padding:3px 0;}
  .bmatch .bteam.win{color:var(--gold); font-weight:700;}
  .bmatch .bteam.tbd{color:var(--muted); font-style:italic;}

  .champion-banner{
    text-align:center; padding:30px 16px; border-radius:var(--radius);
    background:linear-gradient(135deg, var(--gold), #a97f1a);
    color:var(--ink); margin-bottom:16px;
  }
  .champion-banner .display{font-size:36px; margin:6px 0;}

  .results-dashboard{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .result-box{
    flex:1; min-width:160px; text-align:center; padding:14px 10px;
    background:var(--court-panel); border:1px solid rgba(247,244,236,0.12); border-radius:12px;
  }
  .result-box .rlabel{font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted);}
  .result-box .rvalue{font-family:'Anton',sans-serif; font-size:16px; margin-top:6px; letter-spacing:0.3px;}
  .result-box.winner-box{border-color:var(--gold);}
  .result-box.winner-box .rvalue{color:var(--gold);}
  .result-box.runner-box{border-color:var(--muted);}
  .result-box.runner-box .rvalue{color:var(--muted);}
  .result-box.semi-box{border-color:#b98a5e;}
  .result-box.semi-box .rvalue{color:#c99a70; font-size:14px;}

  .error-banner{
    background:rgba(201,74,44,0.18); border:1px solid var(--danger); color:var(--cream);
    border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:13px;
  }
  .share-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:rgba(247,244,236,0.05); border:1px solid rgba(247,244,236,0.15);
    border-radius:12px; padding:10px 14px; margin-bottom:16px; font-size:12px;
  }
  .share-bar .link-txt{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:120px;
  }
  .status-tag{
    display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
    font-family:'JetBrains Mono',monospace; font-weight:700;
    background:rgba(247,244,236,0.1); color:var(--muted);
  }
  .status-tag.qualifying{ background:var(--gold); color:var(--ink); }
  .group-tag{
    display:inline-block; padding:2px 8px; border-radius:6px; font-size:10px;
    text-transform:uppercase; letter-spacing:0.5px; font-weight:700;
    background:rgba(247,244,236,0.08); color:var(--muted); margin-left:8px;
  }
  .paid-check{
    display:inline-flex; align-items:center; gap:6px; font-size:12px;
    color:var(--muted); cursor:default; white-space:nowrap;
  }
  .paid-check input{ width:15px; height:15px; cursor:pointer; accent-color:var(--gold); }
  .paid-check input:disabled{ cursor:default; }
  .footnote{font-size:12px; color:var(--muted); margin-top:24px; line-height:1.5;}
  .row-actions{display:flex; gap:6px;}
  .lock-panel{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .warn{color:var(--smash); font-size:12px; margin-top:6px;}
</style>
</head>
<body>
<div id="app">Loading tournament…</div>

<script>
(function(){
  // ---------------------------------------------------------------------
  // Shared storage backend
  // ---------------------------------------------------------------------
  // Primary: ExtendsClass JSON Storage (https://extendsclass.com/json-storage.html)
  //   Free, no login needed to READ or SAVE data, and — unlike the old backend —
  //   documented with no auto-delete-after-inactivity policy. Creating a
  //   BRAND-NEW tournament link needs a free API key (no credit card, ~2 min
  //   signup at https://extendsclass.com/connect) pasted into CONFIG below.
  //   Until a real key is pasted in, new links automatically fall back to the
  //   zero-setup backend below, so the app still works with no setup at all.
  // Fallback: JSONBlob (https://jsonblob.com) — zero setup, no account, but its
  //   free tier can silently delete a blob after a stretch of inactivity. That
  //   is what caused the "status 404 / could not load tournament data" error.
  //
  // Either way, this version can SELF-HEAL from a dead link (see recoverStorage
  // below) and lets the admin export/import a manual JSON backup at any time.
  const CONFIG = {
    extendsclassApiKey: '455e62ca-9eb2-11f1-b14c-0242ac110005'
  };

  function hasRealApiKey(){
    return !!CONFIG.extendsclassApiKey && CONFIG.extendsclassApiKey.indexOf('PASTE-') !== 0;
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // Shared rate-limit cooldown: when ANY request (poll or save) gets a 429,
  // every part of the app backs off together for a while, instead of the
  // background poll and live-scoring saves independently hammering the free
  // storage service and making the throttling worse.
  let rateLimitedUntil = 0;
  function inCooldown(){ return Date.now() < rateLimitedUntil; }
  function noteRateLimited(){ rateLimitedUntil = Date.now() + 20000; }

  async function fetchWithRetry(url, options, retries){
    retries = retries == null ? 2 : retries;
    let lastRes = null;
    for(let attempt = 0; attempt <= retries; attempt++){
      lastRes = await fetch(url, options);
      if(lastRes.status !== 429) return lastRes;
      noteRateLimited();
      if(attempt < retries) await sleep(1500 * (attempt + 1)); // back off a bit longer each retry
    }
    return lastRes; // still 429 after retries — let the caller handle it
  }

  const BACKENDS = {
    ec: {
      label: 'ExtendsClass',
      itemUrl(id){ return 'https://json.extendsclass.com/bin/' + id; },
      async create(body){
        if(!hasRealApiKey()) throw new Error('no-api-key');
        const res = await fetchWithRetry('https://json.extendsclass.com/bin', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Api-key': CONFIG.extendsclassApiKey},
          body: JSON.stringify(body)
        });
        if(!res.ok) throw new Error('Could not create shared storage on ExtendsClass (status ' + res.status + ').');
        const data = await res.json();
        if(!data || !data.id) throw new Error('ExtendsClass did not return a storage id.');
        return data.id;
      },
      get(id){ return fetchWithRetry(this.itemUrl(id) + '?_=' + Date.now(), { headers: {'Accept':'application/json'}, cache: 'no-store' }); },
      put(id, body){ return fetchWithRetry(this.itemUrl(id), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
    },
    jb: {
      label: 'JSONBlob',
      itemUrl(id){ return 'https://jsonblob.com/api/jsonBlob/' + id; },
      async create(body){
        const res = await fetchWithRetry('https://jsonblob.com/api/jsonBlob', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify(body)
        });
        if(res.status === 429) throw new Error('The shared storage service is busy right now (too many requests). Wait a minute and reload.');
        if(!res.ok) throw new Error('Could not create shared storage (status ' + res.status + ').');
        const location = res.headers.get('Location') || res.headers.get('location');
        if(!location) throw new Error('Shared storage created, but no id was returned.');
        return location.split('/').pop();
      },
      get(id){ return fetchWithRetry(this.itemUrl(id) + '?_=' + Date.now(), { headers: {'Accept':'application/json', 'Cache-Control':'no-cache'}, cache: 'no-store' }); },
      put(id, body){ return fetchWithRetry(this.itemUrl(id), { method: 'PUT', headers: {'Content-Type':'application/json', 'Accept':'application/json'}, body: JSON.stringify(body) }); }
    }
  };

  let storeRef = null;       // {backend:'ec'|'jb', id:'...'} — which backend + id this link points at
  let storageStatus = 'ok';  // 'ok' | 'missing' (confirmed 404 — dead link) | 'error' (transient/network)
  let state = null;
  let isAdmin = false;
  let activeTab = 'teams';
  let tossAnim = {}; // matchId -> {flipping, result}
  let storageError = null;
  let scopedMatchId = null;  // set when this link is a single-match "umpire link" (#...&match=<id>)

  function defaultState(){
    return {
      teams: [],
      groups: [],
      matches: [],
      qualifyPerGroup: 1,
      adminPin: null,
      champion: null,
      tournamentDate: null,
      monthlyResults: []
    };
  }

  function uid(){ return Math.random().toString(36).slice(2,10); }

  // The URL hash can carry several "key=value" pairs joined with '&', e.g.
  // "#store=jb:abc123&match=x7f2" for a single-match umpire link.
  function parseHashParams(){
    const raw = window.location.hash.replace(/^#/, '');
    const out = {};
    raw.split('&').forEach(pair => {
      if(!pair) return;
      const i = pair.indexOf('=');
      if(i === -1) return;
      out[pair.slice(0, i)] = decodeURIComponent(pair.slice(i + 1));
    });
    return out;
  }

  function getStoreRefFromHash(){
    const params = parseHashParams();
    if(params.store){
      const m = params.store.match(/^([a-z]+):([a-zA-Z0-9_-]+)$/);
      if(m) return { backend: m[1], id: m[2] };
    }
    if(params.blob) return { backend: 'jb', id: params.blob }; // links created before this fix
    return null;
  }

  function getScopedMatchIdFromHash(){
    const params = parseHashParams();
    return params.match || null;
  }

  function setStoreRefInHash(ref){
    const params = parseHashParams();
    params.store = ref.backend + ':' + ref.id;
    delete params.blob;
    window.location.hash = Object.keys(params).map(k => k + '=' + params[k]).join('&');
  }

  // Creates a brand-new shared store (tries the durable backend first, falls
  // back to the zero-setup one) and points this link's URL hash at it.
  async function createNewStore(body){
    let ref;
    try{
      const id = await BACKENDS.ec.create(body);
      ref = { backend: 'ec', id };
    }catch(e){
      const id = await BACKENDS.jb.create(body);
      ref = { backend: 'jb', id };
    }
    setStoreRefInHash(ref);
    storeRef = ref;
    return ref;
  }

  async function ensureStoreRef(){
    const existing = getStoreRefFromHash();
    if(existing){ storeRef = existing; return; }
    // First-ever visit for this link: create a fresh shared store and put its ref in the URL.
    await createNewStore(defaultState());
  }

  async function loadState(){
    storageError = null; storageStatus = 'ok';
    try{
      await ensureStoreRef();
      const backend = BACKENDS[storeRef.backend];
      const res = await backend.get(storeRef.id);
      if(res.status === 404){
        storageStatus = 'missing';
        throw new Error('The saved data for this exact link no longer exists on ' + backend.label + '.');
      }
      if(res.status === 429) throw new Error('The shared storage service is busy right now (too many requests). Wait a minute and reload — your data is safe.');
      if(!res.ok) throw new Error('Could not load tournament data (status ' + res.status + ').');
      state = Object.assign(defaultState(), await res.json());
    }catch(e){
      console.error('Storage error', e);
      if(storageStatus !== 'missing') storageStatus = 'error';
      storageError = storageStatus === 'missing'
        ? e.message
        : 'Could not connect to shared tournament storage. Check your internet connection, then reload this page. (' + e.message + ')';
      state = defaultState();
    }
  }

  async function saveState(){
    try{
      if(!storeRef) await ensureStoreRef();
      const backend = BACKENDS[storeRef.backend];
      const res = await backend.put(storeRef.id, state);
      if(res.status === 429){ storageError = 'The shared storage service is busy right now — this change may not have saved. Wait a minute, then try again.'; return false; }
      else if(res.status === 404){
        storageStatus = 'missing';
        storageError = 'This link\'s storage no longer exists. Use "Start new shared storage" or "Restore backup" below, then redo this change.';
        return false;
      }
      else if(!res.ok){ console.error('Save failed with status', res.status); storageError = 'Your last change may not have saved. Check your connection and try again.'; return false; }
      else { storageError = null; if(storageStatus !== 'missing') storageStatus = 'ok'; return true; }
    }catch(e){ console.error('Storage error', e); storageError = 'Your last change may not have saved. Check your connection and try again.'; return false; }
  }

  // ---------------------------------------------------------------------
  // Concurrency-safe mutations
  // ---------------------------------------------------------------------
  // Every admin/umpire action that changes shared data goes through this:
  // fetch the freshest copy from storage, apply just this one change on top
  // of it, then save. That keeps multiple people (e.g. 3 umpires scoring 3
  // courts at once, or an umpire and the admin at the same time) from
  // clobbering each other's work — each write is based on the latest data,
  // not on whatever this device happened to load minutes ago.
  async function mergeAndSave(applyFn){
    try{
      if(!storeRef) await ensureStoreRef();
      const backend = BACKENDS[storeRef.backend];
      const res = await backend.get(storeRef.id);
      if(res.status === 404){
        storageStatus = 'missing';
        storageError = 'This link\'s storage no longer exists. Use "Start new shared storage" or "Restore backup" below, then redo this change.';
        render();
        return false;
      }
      if(res.status === 429){
        storageError = 'The shared storage service is busy right now — this change was not saved. Try again shortly.';
        render();
        return false;
      }
      if(!res.ok){
        storageError = 'Could not reach shared storage (status ' + res.status + '). This change was not saved.';
        render();
        return false;
      }
      state = Object.assign(defaultState(), await res.json());
    }catch(e){
      console.error('Storage error', e);
      storageError = 'Could not reach shared storage. Check your connection — this change was not saved.';
      render();
      return false;
    }
    applyFn(state);
    const ok = await saveState();
    render();
    return ok;
  }

  // Applies one match's current LOCAL score/winner/toss on top of the latest
  // server data (so other courts' concurrent updates aren't lost), re-running
  // bracket propagation against that fresh data if this save decides a winner.
  //
  // Single-flight by design: if a save for this match is already in progress
  // when a newer tap comes in, we do NOT start a second overlapping save —
  // we just flag "there's newer data, redo this once the current save
  // finishes" and let the in-flight save's own loop pick up the latest score
  // afterwards. Without this, two overlapping saves (e.g. one retrying after
  // a "busy" response while a newer one is also in flight) can finish out of
  // order — an OLDER, lower score's save landing on the server after a newer
  // one, which is exactly what made the score visibly jump backwards.
  let matchSaveInFlight = {};
  let matchSaveDirty = {};

  async function saveMatchNow(matchId){
    if(matchSaveInFlight[matchId]){
      matchSaveDirty[matchId] = true;
      return;
    }
    matchSaveInFlight[matchId] = true;
    try{
      let more = true;
      while(more){
        matchSaveDirty[matchId] = false;
        const local = state.matches.find(x => x.id === matchId);
        if(!local) break;
        const patch = { scoreA: local.scoreA, scoreB: local.scoreB, winner: local.winner, toss: local.toss };
        const ok = await mergeAndSave(() => {
          const fm = state.matches.find(x => x.id === matchId);
          if(!fm) return;
          Object.assign(fm, patch);
          if(fm.winner && fm.stage !== 'league'){ propagateWinner(fm); }
        });
        if(!ok){
          await sleep(3000); // back off, then retry with whatever the LATEST local score is by then
          matchSaveDirty[matchId] = true;
        }
        more = matchSaveDirty[matchId];
      }
    } finally {
      matchSaveInFlight[matchId] = false;
    }
  }

  // Debounced save for rapid-fire actions (live point-tapping): coalesces a
  // burst of taps into one merge-save ~800ms after the last one, instead of
  // firing a network round-trip per point — keeps request volume sane when
  // several courts are all tapping at once. Any resulting storage error still
  // surfaces via a re-render, just slightly delayed.
  let saveDebounceTimers = {};
  function scheduleSave(key, fn, delay){
    if(saveDebounceTimers[key]) clearTimeout(saveDebounceTimers[key]);
    saveDebounceTimers[key] = setTimeout(async () => {
      delete saveDebounceTimers[key];
      await fn();
    }, delay || 800);
  }

  // Self-heal: point this link at a brand-new store (optionally seeded with
  // imported backup data) instead of staying permanently stuck on a dead link.
  async function recoverStorage(seedState){
    state = Object.assign(defaultState(), seedState || state || {});
    await createNewStore(state);
    storageStatus = 'ok'; storageError = null;
    await saveState();
    render();
  }

  function exportBackup(){
    const dataBlob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(dataBlob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = 'rookie-rally-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importBackupFile(file, cb){
    const reader = new FileReader();
    reader.onload = () => {
      try{ cb(null, JSON.parse(reader.result)); }
      catch(e){ cb(new Error('That file is not valid tournament backup JSON.')); }
    };
    reader.onerror = () => cb(new Error('Could not read that file.'));
    reader.readAsText(file);
  }

  function shareableLink(){ return window.location.href; }

  // ---------- Domain logic ----------
  function groupOptions(n){
    const opts = [];
    if(n < 4) return opts;
    const maxG = Math.floor(n/2);
    for(let g=2; g<=maxG; g++){
      const base = Math.floor(n/g), rem = n % g;
      const desc = rem === 0
        ? (g + ' groups of ' + base)
        : (rem + ' group(s) of ' + (base+1) + ', ' + (g-rem) + ' of ' + base);
      opts.push({g, desc});
    }
    return opts;
  }

  function roundRobinPairs(teamIds){
    let ids = teamIds.slice();
    if(ids.length % 2 !== 0) ids.push(null);
    const n = ids.length, rounds = n-1, half = n/2;
    let arr = ids.slice();
    const pairs = [];
    for(let r=0; r<rounds; r++){
      for(let i=0; i<half; i++){
        const a = arr[i], b = arr[n-1-i];
        if(a !== null && b !== null) pairs.push([a,b]);
      }
      arr.splice(1,0, arr.pop());
    }
    return pairs;
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // manualBuckets, if given, is an array (one entry per group) of teamId
  // arrays chosen by the admin — used instead of the random shuffle below.
  function createGroups(numGroups, manualBuckets){
    let groups;
    if(manualBuckets){
      groups = manualBuckets.map((teamIds, i) => ({ id: uid(), name: 'Group ' + String.fromCharCode(65+i), teamIds: teamIds.slice() }));
    } else {
      const shuffled = shuffle(state.teams.map(t=>t.id));
      groups = [];
      for(let i=0;i<numGroups;i++){
        groups.push({ id: uid(), name: 'Group ' + String.fromCharCode(65+i), teamIds: [] });
      }
      shuffled.forEach((tid, idx) => { groups[idx % numGroups].teamIds.push(tid); });
    }
    state.groups = groups;
    state.matches = [];
    groups.forEach(g => {
      const pairs = roundRobinPairs(g.teamIds);
      pairs.forEach(([a,b]) => {
        state.matches.push({
          id: uid(), stage: 'league', groupId: g.id, slotIndex: null,
          teamA: a, teamB: b, scoreA: null, scoreB: null, winner: null, toss: null
        });
      });
    });
    state.champion = null;
  }

  function teamName(id){
    if(!id) return null;
    const t = state.teams.find(t=>t.id===id);
    return t ? t.name : 'Unknown';
  }

  function computeStandings(groupId){
    const grp = state.groups.find(g=>g.id===groupId);
    if(!grp) return [];
    const table = {};
    grp.teamIds.forEach(tid => { table[tid] = {teamId:tid, played:0, wins:0, losses:0, pf:0, pa:0}; });
    state.matches.filter(m=>m.stage==='league' && m.groupId===groupId).forEach(m=>{
      if(m.winner){
        table[m.teamA].played++; table[m.teamB].played++;
        table[m.teamA].pf += (m.scoreA||0); table[m.teamA].pa += (m.scoreB||0);
        table[m.teamB].pf += (m.scoreB||0); table[m.teamB].pa += (m.scoreA||0);
        if(m.winner === m.teamA){ table[m.teamA].wins++; table[m.teamB].losses++; }
        else { table[m.teamB].wins++; table[m.teamA].losses++; }
      }
    });
    return Object.values(table).sort((a,b)=>{
      if(b.wins !== a.wins) return b.wins - a.wins;
      const pdA = a.pf - a.pa, pdB = b.pf - b.pa;
      if(pdB !== pdA) return pdB - pdA;
      return b.pf - a.pf;
    });
  }

  function findTeamGroupAndStanding(teamId){
    for(const g of state.groups){
      if(g.teamIds.includes(teamId)){
        const standings = computeStandings(g.id);
        const rank = standings.findIndex(r=>r.teamId===teamId);
        return { group: g, standings, rank, row: standings[rank] };
      }
    }
    return null;
  }

  function combinedStandings(){
    // One flat, ranked list across every group — each row keeps its own group
    // qualifying rank (for the Status tag) but the overall order spans all teams.
    const rows = [];
    state.groups.forEach(g => {
      const standings = computeStandings(g.id);
      standings.forEach((row, groupRank) => {
        rows.push(Object.assign({}, row, { group: g, groupRank }));
      });
    });
    rows.sort((a,b) => {
      if(b.wins !== a.wins) return b.wins - a.wins;
      const pdA = a.pf - a.pa, pdB = b.pf - b.pa;
      if(pdB !== pdA) return pdB - pdA;
      return b.pf - a.pf;
    });
    return rows;
  }

  function findFinalMatch(){
    return state.matches.find(m => m.stage === 'final') || null;
  }

  function findSemifinalMatches(){
    return state.matches.filter(m => m.stage === 'sf');
  }

  function statusTag(rank, qualifyPerGroup){
    const qualifying = rank < qualifyPerGroup;
    if(!qualifying) return '';
    return '<span class="status-tag qualifying">Q</span>';
  }

  function groupComplete(groupId){
    const ms = state.matches.filter(m=>m.stage==='league' && m.groupId===groupId);
    return ms.length > 0 && ms.every(m=>m.winner);
  }
  function allGroupsComplete(){
    return state.groups.length > 0 && state.groups.every(g=>groupComplete(g.id));
  }

  function knockoutStagesForQ(q){
    if(q===8) return ['qf','sf','final'];
    if(q===4) return ['sf','final'];
    if(q===2) return ['final'];
    return null;
  }

  function computeQualifierCount(){
    return state.groups.length * state.qualifyPerGroup;
  }

  function generateKnockouts(){
    const q = computeQualifierCount();
    const stages = knockoutStagesForQ(q);
    if(!stages) return false;
    const qualifiers = [];
    for(let rank=0; rank<state.qualifyPerGroup; rank++){
      state.groups.forEach(g => {
        const standings = computeStandings(g.id);
        if(standings[rank]) qualifiers.push(standings[rank].teamId);
      });
    }
    const firstRoundPairs = [];
    for(let i=0;i<q/2;i++){ firstRoundPairs.push([qualifiers[i], qualifiers[q-1-i]]); }

    state.matches = state.matches.filter(m=>m.stage==='league');
    firstRoundPairs.forEach(([a,b], idx) => {
      state.matches.push({ id: uid(), stage: stages[0], groupId:null, slotIndex: idx, teamA:a, teamB:b, scoreA:null, scoreB:null, winner:null, toss:null });
    });
    for(let r=1;r<stages.length;r++){
      const count = q / Math.pow(2, r+1);
      for(let i=0;i<count;i++){
        state.matches.push({ id: uid(), stage: stages[r], groupId:null, slotIndex: i, teamA:null, teamB:null, scoreA:null, scoreB:null, winner:null, toss:null });
      }
    }
    state.champion = null;
  }

  function currentKnockoutStages(){
    const q = computeQualifierCount();
    return knockoutStagesForQ(q) || [];
  }

  function propagateWinner(match){
    const stages = currentKnockoutStages();
    const idx = stages.indexOf(match.stage);
    if(idx === -1 || idx === stages.length - 1){
      if(match.stage === 'final' || (idx === stages.length-1 && stages.length>0)){
        state.champion = match.winner;
      }
      return;
    }
    const nextStage = stages[idx+1];
    const nextSlot = Math.floor(match.slotIndex/2);
    const nextMatch = state.matches.find(m=>m.stage===nextStage && m.slotIndex===nextSlot);
    if(nextMatch){
      if(match.slotIndex % 2 === 0){ nextMatch.teamA = match.winner; } else { nextMatch.teamB = match.winner; }
    }
  }

  function decideWinner(scoreA, scoreB){
    if(scoreA == null || scoreB == null) return null;
    if(scoreA >= 21 && scoreA > scoreB) return 'A';
    if(scoreB >= 21 && scoreB > scoreA) return 'B';
    return null;
  }

  // ---------- Rendering ----------
  function el(html){
    html = html.trim();
    // Browsers silently drop <tr>/<td>/<th> tags when parsed outside a real
    // <table> context, so those need a table/tbody/tr wrapper to parse correctly.
    if(/^<tr[\s>]/i.test(html)){
      const table = document.createElement('table');
      const tbody = document.createElement('tbody');
      table.appendChild(tbody);
      tbody.innerHTML = html;
      return tbody.firstElementChild;
    }
    if(/^<t[dh][\s>]/i.test(html)){
      const table = document.createElement('table');
      const tbody = document.createElement('tbody');
      const tr = document.createElement('tr');
      table.appendChild(tbody);
      tbody.appendChild(tr);
      tr.innerHTML = html;
      return tr.firstElementChild;
    }
    const d = document.createElement('div');
    d.innerHTML = html;
    return d.firstElementChild;
  }

  function render(){
    if(scopedMatchId){ renderUmpireView(); return; }
    const root = document.getElementById('app');
    root.innerHTML = '';
    root.appendChild(renderHeader());
    if(isAdmin && window.location.protocol === 'file:') root.appendChild(renderFileProtocolWarning());
    if(storageStatus === 'missing') root.appendChild(renderRecoveryCard());
    else if(storageError) root.appendChild(renderErrorBanner());
    root.appendChild(renderResultsDashboard());
    root.appendChild(renderTabs());
    if(activeTab === 'teams') root.appendChild(renderTeamsTab());
    if(activeTab === 'groups') root.appendChild(renderGroupsTab());
    if(activeTab === 'knockouts') root.appendChild(renderKnockoutsTab());
    if(activeTab === 'standings') root.appendChild(renderStandingsTab());
    if(activeTab === 'overview') root.appendChild(renderOverviewTab());
    root.appendChild(renderFootnote());
  }

  // ---------------------------------------------------------------------
  // Umpire view — opened via a per-match link the admin generates and hands
  // to the court umpire. Shows ONLY that one match, big tap-to-score buttons,
  // no admin PIN and no visibility into the rest of the tournament.
  // ---------------------------------------------------------------------
  function currentScopedMatch(){
    return state && state.matches ? state.matches.find(x => x.id === scopedMatchId) || null : null;
  }

      root.appendChild(el('<div class="card"><div class="empty">Waiting for both teams to be confirmed for this match. Check back shortly.</div></div>'));

        if(current !== state.adminPin){ alert('Incorrect current PIN.'); return; }
        const next = prompt('Enter a new admin PIN:');
        if(next === null) return;
        const trimmed = next.trim();
        if(!trimmed){ alert('PIN cannot be empty.'); return; }
        const confirmNext = prompt('Re-enter the new PIN to confirm:');
        if(confirmNext === null) return;
        if(confirmNext !== trimmed){ alert('Those two didn\'t match — PIN not changed. Try again.'); return; }

      restoreBtn.onclick = () => restoreInput.click();
      restoreInput.onchange = () => {
        const file = restoreInput.files[0];
        if(!file) return;
        importBackupFile(file, async (err, data) => {
          if(err){ alert(err.message); return; }
          if(!confirm('Replace ALL current tournament data with this backup file? This cannot be undone.')) return;
          state = Object.assign(defaultState(), data);
          await saveState(); render();

  async function editTeam(teamId){
    const t = state.teams.find(x=>x.id===teamId);
    if(!t) return;
    const newName = prompt('Edit team name:', t.name);
    if(newName === null) return; // cancelled
    const trimmed = newName.trim();
    if(!trimmed){ alert('Team name cannot be empty.'); return; }
    await mergeAndSave(() => {
      const ft = state.teams.find(x => x.id === teamId);
      if(ft) ft.name = trimmed;
    });

  function buildPaidCheckbox(t){
    const label = el('<label class="paid-check" title="Paid"><input type="checkbox"></label>');
    const input = label.querySelector('input');
    input.checked = !!t.paid;
    if(!isAdmin){

        await mergeAndSave(() => {
          const ft = state.teams.find(x => x.id === t.id);

        });

  function renderMatchCard(m){
    const wrap = el('<div class="match"></div>');
    const nameA = teamName(m.teamA) || 'TBD';
    const nameB = teamName(m.teamB) || 'TBD';
    const top = el('<div class="match-top"></div>');
    const versus = el('<div class="versus"></div>');
    // Live tap-scoring: while both teams are set and the match isn't decided yet,
    // the admin can tap a team's own name chip each time that team wins a point.
    const live = !!(isAdmin && m.teamA && m.teamB && !m.winner);
    const chipA = el('<div class="team-chip' + (!m.teamA?' tbd':'') + (m.winner===m.teamA?' win':'') + (live?' tappable':'') + '"' + (live?' title="Tap each time '+escapeHtml(nameA)+' wins a point">':'>') + escapeHtml(nameA) + '</div>');
    const vsTxt = el('<div class="vs-txt">vs</div>');
    const chipB = el('<div class="team-chip' + (!m.teamB?' tbd':'') + (m.winner===m.teamB?' win':'') + (live?' tappable':'') + '"' + (live?' title="Tap each time '+escapeHtml(nameB)+' wins a point">':'>') + escapeHtml(nameB) + '</div>');
    if(live){
      const updateDisplay = () => {
        const topEl = wrap.querySelector('.match-top');
        let scoreEl = topEl.querySelector('.score-mono');
        const text = m.scoreA + ' — ' + m.scoreB;
        if(scoreEl){ scoreEl.textContent = text; }
        else { topEl.appendChild(el('<div class="score-mono">' + text + '</div>')); }
        const hint = wrap.querySelector('.live-hint');
        if(hint) hint.remove();
      };
      chipA.onclick = () => bumpMatchScore(m, 'A', { updateDisplay });
      chipB.onclick = () => bumpMatchScore(m, 'B', { updateDisplay });
    }
    versus.appendChild(chipA); versus.appendChild(vsTxt); versus.appendChild(chipB);
    top.appendChild(versus);

    if(m.scoreA != null && m.scoreB != null){
      top.appendChild(el('<div class="score-mono">' + m.scoreA + ' — ' + m.scoreB + '</div>'));
    }
    wrap.appendChild(top);

    if(live && m.scoreA == null){
      wrap.appendChild(el('<div class="live-hint">🏸 Tap a team\'s name above each time they win a point — first to 21 (and ahead) wins automatically.</div>'));
    }

    if(m.winner){
      wrap.appendChild(el('<div class="winner-tag">🏆 ' + escapeHtml(teamName(m.winner)) + ' wins</div>'));
    }
    if(m.toss){
      wrap.appendChild(el('<div class="toss-note">Toss: ' + escapeHtml(teamName(m.toss.winnerTeam)) + ' won the toss (' + m.toss.result + ') and chose ' + m.toss.choice + '.</div>'));
    }

    if(isAdmin && m.teamA && m.teamB){
      const actions = el('<div class="match-actions"></div>');
      const tossBtn = el('<button class="small">🪙 Toss</button>');
      tossBtn.onclick = () => openToss(m, wrap);
      actions.appendChild(tossBtn);
      if(!m.winner){
        const umpBtn = el('<button class="small gold">🔗 Umpire link</button>');
        umpBtn.onclick = () => showUmpireLinkBox(m, wrap);
        actions.appendChild(umpBtn);
      }
      const editBtn = el('<button class="small">' + (m.winner ? 'Edit score' : 'Enter/fix score') + '</button>');
      editBtn.onclick = () => openScoreEditor(m, wrap);
      actions.appendChild(editBtn);
      wrap.appendChild(actions);
    }
    return wrap;
  }

  // Adds one point for the tapped team, live (used by both the admin's inline
  // match card and the scoped umpire view). If that reaches a winning score,
  // it locks the match in immediately: saves via a fresh merge (so it can't
  // clobber another court's concurrent update) and does a full re-render so
  // the winner tag, bracket propagation and standings all update. Otherwise
  // it just updates this view's own score display via opts.updateDisplay and
  // queues a debounced merge-save, so rapid tapping during a rally stays
  // snappy instead of round-tripping the network on every single point.
  function bumpMatchScore(m, side, opts){
    if(m.winner) return; // already decided — won't be tappable after the next re-render anyway
    if(m.scoreA == null) m.scoreA = 0;
    if(m.scoreB == null) m.scoreB = 0;
    if(side === 'A') m.scoreA += 1; else m.scoreB += 1;

    const res = decideWinner(m.scoreA, m.scoreB);
    if(res){
      m.winner = res === 'A' ? m.teamA : m.teamB;
      render(); // optimistic instant UI update showing the winner
      saveMatchNow(m.id); // merges with the latest data, propagates the bracket, persists
      return;
    }

    if(opts && opts.updateDisplay) opts.updateDisplay();
    scheduleSave(m.id, () => saveMatchNow(m.id));
  }

  // Generates a link scoped to just this one match — no admin PIN, no other
  // tabs, just big tap-to-score buttons for that match. Meant to be handed to
  // the umpire running that court; their taps sync back here automatically.
  function umpireLinkFor(matchId){
    return window.location.href.split('#')[0] + '#store=' + storeRef.backend + ':' + storeRef.id + '&match=' + matchId;
  }

  function showUmpireLinkBox(m, wrap){
    if(wrap.querySelector('.ump-link-box')) return;
    const link = umpireLinkFor(m.id);
    const isLocalFile = window.location.protocol === 'file:';
    const box = el(
      '<div class="score-edit ump-link-box" style="flex-direction:column; align-items:flex-start;">' +
        (isLocalFile
          ? '<div class="warn" style="margin-bottom:8px;">⚠️ You\'re viewing this as a local file — this link will only open on THIS computer, the umpire won\'t be able to use it. Open this page from its hosted https:// address instead, then generate the link from there.</div>'
          : '') +
        '<div class="link-txt" style="white-space:normal; word-break:break-all; font-size:12px;">' + escapeHtml(link) + '</div>' +
        '<div style="display:flex; gap:8px; margin-top:8px;">' +
          '<button class="small gold" id="copy-ump-link">Copy link</button>' +
          '<button class="small ghost" id="close-ump-link">Close</button>' +
        '</div>' +
        '<div class="toss-note">Send this to the umpire on this court — no PIN needed, just this one match. Their taps show up here automatically (or hit ↻ Refresh).</div>' +
      '</div>'
    );
    wrap.appendChild(box);
    box.querySelector('#copy-ump-link').onclick = async () => {
      const btn = box.querySelector('#copy-ump-link');
      try{ await navigator.clipboard.writeText(link); btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy link'; }, 1500); }
      catch(e){ alert('Could not copy automatically. Copy this link manually:\n' + link); }
    };
    box.querySelector('#close-ump-link').onclick = () => box.remove();
  }

  function openScoreEditor(m, wrap){
    if(wrap.querySelector('.score-edit')) return;
    const editor = el(
      '<div class="score-edit">' +
        '<div><label>' + escapeHtml(teamName(m.teamA)) + '</label><input type="number" min="0" id="sa" value="' + (m.scoreA ?? '') + '"></div>' +
        '<div><label>' + escapeHtml(teamName(m.teamB)) + '</label><input type="number" min="0" id="sb" value="' + (m.scoreB ?? '') + '"></div>' +
        '<button class="primary" id="save-score">Save</button>' +
      '</div>'
    );
    wrap.appendChild(editor);
    editor.querySelector('#save-score').onclick = async () => {
      const sa = editor.querySelector('#sa').value;
      const sb = editor.querySelector('#sb').value;
      if(sa === '' || sb === ''){ alert('Enter both scores.'); return; }
      const scoreA = Number(sa), scoreB = Number(sb);
      const res = decideWinner(scoreA, scoreB);
      const winner = res === 'A' ? m.teamA : (res === 'B' ? m.teamB : null);
      if(!winner){ alert('Saved. No winner yet — one team needs 21+ points and a lead to be marked the winner.'); }
      await mergeAndSave(() => {
        const fm = state.matches.find(x => x.id === m.id);
        if(!fm) return;
        fm.scoreA = scoreA; fm.scoreB = scoreB; fm.winner = winner;
        if(fm.winner && fm.stage !== 'league'){ propagateWinner(fm); }
      });
    };
  }

  function openToss(m, wrap){
    if(wrap.querySelector('.coin-wrap')) return;
    const box = el(
      '<div class="coin-wrap">' +
        '<div class="coin-scene"><div class="coin"><div class="coin-face heads"><div class="big">₹1</div><div class="small">HEADS</div></div><div class="coin-face tails"><div class="big">₹1</div><div class="small">TAILS</div></div></div></div>' +
        '<button class="small gold" id="flip-btn">Flip the coin</button>' +
        '<div class="toss-result" id="toss-result"></div>' +
      '</div>'
    );
    wrap.appendChild(box);
    const coin = box.querySelector('.coin');
    box.querySelector('#flip-btn').onclick = () => {
      const isTails = Math.random() < 0.5;
      coin.classList.remove('flip','tails');
      void coin.offsetWidth;
      coin.classList.add('flip'); if(isTails) coin.classList.add('tails');
      setTimeout(() => {
        const result = isTails ? 'Tails' : 'Heads';
        box.querySelector('#toss-result').textContent = result + '!';
        const winnerTeam = confirm(result + '! Click OK if ' + teamName(m.teamA) + ' won the toss, or Cancel if ' + teamName(m.teamB) + ' won it.') ? m.teamA : m.teamB;
        const choice = confirm('Did the toss winner choose to SERVE? (OK = Serve, Cancel = Choose side)') ? 'to serve' : 'a side';
        const tossPatch = { result, winnerTeam, choice };
        mergeAndSave(() => {
          const fm = state.matches.find(x => x.id === m.id);
          if(fm) fm.toss = tossPatch;
        });
      }, 2250);
    };
  }

  function renderKnockoutsTab(){
    const wrap = document.createElement('div');
    if(state.champion){
      wrap.appendChild(el('<div class="champion-banner"><div>🏆 Tournament Champion</div><div class="display">' + escapeHtml(teamName(state.champion)) + '</div></div>'));
    }

    const knockoutMatches = state.matches.filter(m=>m.stage!=='league');
    if(knockoutMatches.length === 0){
      const card = el('<div class="card"><h2>Knockouts</h2></div>');
      if(!allGroupsComplete()){
        card.appendChild(el('<div class="empty">Knockout stages unlock automatically once every league match in every group has a result.</div>'));
      } else if(isAdmin){
        const q = computeQualifierCount();
        const valid = [2,4,8].includes(q);
        card.appendChild(el('<div class="empty">All groups complete. ' + q + ' team(s) qualify based on your current group/qualifier settings.</div>'));
        if(valid){
          const b = el('<button class="primary">Generate knockout bracket</button>');
          b.onclick = async () => { await mergeAndSave(() => { generateKnockouts(); }); };
          card.appendChild(b);
        } else {
          card.appendChild(el('<div class="warn">Adjust the group count or qualifiers-per-group (in the Groups tab, before groups exist) so the qualifier total is 2, 4 or 8.</div>'));
        }
      } else {
        card.appendChild(el('<div class="empty">Groups are complete. Waiting for the admin to generate the knockout bracket.</div>'));
      }
      wrap.appendChild(card);
      return wrap;
    }

    const stages = currentKnockoutStages();
    const labels = {qf:'Quarterfinal', sf:'Semifinal', final:'Final'};
    const bracket = el('<div class="bracket"></div>');
    stages.forEach(stage => {
      const col = el('<div class="bracket-round"><h3>' + labels[stage] + '</h3></div>');
      const ms = state.matches.filter(m=>m.stage===stage).sort((a,b)=>a.slotIndex-b.slotIndex);
      ms.forEach(m => col.appendChild(renderBracketMatch(m)));
      bracket.appendChild(col);
    });
    const bcard = el('<div class="card"><h2>Bracket</h2></div>');
    bcard.appendChild(bracket);
    wrap.appendChild(bcard);

    stages.forEach(stage => {
      const ms = state.matches.filter(m=>m.stage===stage).sort((a,b)=>a.slotIndex-b.slotIndex);
      const scard = el('<div class="card"><h2>' + labels[stage] + ' matches</h2></div>');
      ms.forEach(m => scard.appendChild(renderMatchCard(m)));
      wrap.appendChild(scard);
    });
    return wrap;
  }

  function renderBracketMatch(m){
    const box = el('<div class="bmatch"></div>');
    const a = el('<div class="bteam' + (!m.teamA?' tbd':'') + (m.winner && m.winner===m.teamA?' win':'') + '"><span>' + escapeHtml(teamName(m.teamA) || 'TBD') + '</span>' + (m.scoreA!=null?'<span>'+m.scoreA+'</span>':'') + '</div>');
    const b = el('<div class="bteam' + (!m.teamB?' tbd':'') + (m.winner && m.winner===m.teamB?' win':'') + '"><span>' + escapeHtml(teamName(m.teamB) || 'TBD') + '</span>' + (m.scoreB!=null?'<span>'+m.scoreB+'</span>':'') + '</div>');
    box.appendChild(a); box.appendChild(b);
    return box;
  }

  function renderStandingsTab(){
    const wrap = document.createElement('div');
    if(state.groups.length === 0){
      wrap.appendChild(el('<div class="card"><h2>Standings</h2><div class="empty">No groups yet.</div></div>'));
      return wrap;
    }
    const rows = combinedStandings();
    const card = el('<div class="card"><h2><span class="eyebrow">' + rows.length + '</span> Overall Standings</h2></div>');
    const table = el(
      '<table><thead><tr><th>#</th><th>Team</th><th>Group</th><th>P</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>+/-</th><th>Status</th></tr></thead><tbody></tbody></table>'
    );
    const tbody = table.querySelector('tbody');
    rows.forEach((row, i) => {
      const qualifies = row.groupRank < state.qualifyPerGroup;
      const tr = el(
        '<tr' + (qualifies ? ' class="leader"' : '') + '>' +
          '<td>' + (i+1) + '</td>' +
          '<td>' + escapeHtml(teamName(row.teamId)) + '</td>' +
          '<td>' + escapeHtml(row.group.name) + '</td>' +
          '<td>' + row.played + '</td><td>' + row.wins + '</td><td>' + row.losses + '</td>' +
          '<td>' + row.pf + '</td><td>' + row.pa + '</td><td>' + (row.pf-row.pa) + '</td>' +
          '<td>' + statusTag(row.groupRank, state.qualifyPerGroup) + '</td>' +
        '</tr>'
      );
      tbody.appendChild(tr);
    });
    card.appendChild(table);
    wrap.appendChild(card);
    return wrap;
  }

  function monthLabelFromDate(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d.getTime())) return null;
    return d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  }

  function renderOverviewTab(){
    const wrap = document.createElement('div');
    const currentLabel = monthLabelFromDate(state.tournamentDate);

    if(isAdmin){
      const dateCard = el(
        '<div class="card">' +
          '<h2>Tournament date</h2>' +
          '<div class="grid-2">' +
            '<div><label>Date this tournament is being held</label><input type="date" id="tourney-date" value="' + (state.tournamentDate || '') + '"></div>' +
          '</div>' +
          '<div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">' +
            '<button class="primary small" id="save-date-btn">Save date</button>' +
            '<button class="small gold" id="archive-btn">Archive current Top 5 under this month</button>' +
          '</div>' +
        '</div>'
      );
      wrap.appendChild(dateCard);
      dateCard.querySelector('#save-date-btn').onclick = async () => {
        const val = dateCard.querySelector('#tourney-date').value;
        await mergeAndSave(() => { state.tournamentDate = val || null; });
      };
      dateCard.querySelector('#archive-btn').onclick = async () => {
        if(!state.tournamentDate){ alert('Set and save a tournament date first.'); return; }
        if(state.groups.length === 0){ alert('No standings yet to archive.'); return; }
        const label = monthLabelFromDate(state.tournamentDate);
        const top5 = combinedStandings().slice(0, 5).map(row => ({
          name: teamName(row.teamId), wins: row.wins, losses: row.losses, diff: row.pf - row.pa
        }));
        const tourneyDate = state.tournamentDate;
        if(!confirm('Archive the current Top 5 under "' + label + '"? You can keep editing scores afterward — this just saves a snapshot.')) return;
        await mergeAndSave(() => {
          state.monthlyResults.push({ id: uid(), label, date: tourneyDate, top5 });
        });
      };
    }

    if(state.groups.length === 0 && state.monthlyResults.length === 0){
      wrap.appendChild(el('<div class="card"><div class="empty">Standings will appear here once groups and matches are set up.</div></div>'));
      return wrap;
    }

    if(state.groups.length > 0){
      const top5 = combinedStandings().slice(0, 5);
      const card = el('<div class="card"><h2>' + escapeHtml(currentLabel || 'Current') + ' — Top 5 Teams (live)</h2></div>');
      const table = el(
        '<table><thead><tr><th>#</th><th>Team</th><th>Group</th><th>W</th><th>L</th><th>+/-</th></tr></thead><tbody></tbody></table>'
      );
      const tbody = table.querySelector('tbody');
      top5.forEach((row, i) => {
        const tr = el(
          '<tr' + (i===0 ? ' class="leader"' : '') + '>' +
            '<td>' + (i+1) + '</td>' +
            '<td>' + escapeHtml(teamName(row.teamId)) + '</td>' +
            '<td>' + escapeHtml(row.group.name) + '</td>' +
            '<td>' + row.wins + '</td><td>' + row.losses + '</td><td>' + (row.pf-row.pa) + '</td>' +
          '</tr>'
        );
        tbody.appendChild(tr);
      });
      card.appendChild(table);
      wrap.appendChild(card);
    }

    if(state.monthlyResults.length){
      const slicedNewestFirst = state.monthlyResults.slice().reverse();
      slicedNewestFirst.forEach(entry => {
        const card = el('<div class="card"><h2>' + escapeHtml(entry.label) + ' — Top 5 (archived)</h2></div>');
        const table = el(
          '<table><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>+/-</th></tr></thead><tbody></tbody></table>'
        );
        const tbody = table.querySelector('tbody');
        entry.top5.forEach((row, i) => {
          tbody.appendChild(el(
            '<tr' + (i===0 ? ' class="leader"' : '') + '>' +
              '<td>' + (i+1) + '</td><td>' + escapeHtml(row.name) + '</td>' +
              '<td>' + row.wins + '</td><td>' + row.losses + '</td><td>' + row.diff + '</td>' +
            '</tr>'
          ));
        });
        card.appendChild(table);
        if(isAdmin){
          const delBtn = el('<button class="small ghost" style="margin-top:10px;">Remove this archived month</button>');
          delBtn.onclick = async () => {
            if(!confirm('Remove the archived "' + entry.label + '" results? This cannot be undone.')) return;
            await mergeAndSave(() => {
              state.monthlyResults = state.monthlyResults.filter(x => x.id !== entry.id);
            });
          };
          card.appendChild(delBtn);
        }
        wrap.appendChild(card);
      });
    }
    return wrap;
  }

  function renderResultsDashboard(){
    if(state.groups.length === 0) return document.createDocumentFragment();
    const final = findFinalMatch();
    const sfMatches = findSemifinalMatches();

    const winnerId = (final && final.winner) ? final.winner : null;
    const runnerId = (final && final.winner && final.teamA && final.teamB)
      ? (final.winner === final.teamA ? final.teamB : final.teamA) : null;
    const semiLosers = sfMatches.filter(m => m.winner).map(m => m.winner === m.teamA ? m.teamB : m.teamA);

    const wrap = el('<div class="results-dashboard"></div>');
    wrap.appendChild(el(
      '<div class="result-box winner-box">' +
        '<div class="rlabel">🏆 Winner</div>' +
        '<div class="rvalue">' + (winnerId ? escapeHtml(teamName(winnerId)) : 'TBD') + '</div>' +
      '</div>'
    ));
    wrap.appendChild(el(
      '<div class="result-box runner-box">' +
        '<div class="rlabel">🥈 Runner-up</div>' +
        '<div class="rvalue">' + (runnerId ? escapeHtml(teamName(runnerId)) : 'TBD') + '</div>' +
      '</div>'
    ));
    wrap.appendChild(el(
      '<div class="result-box semi-box">' +
        '<div class="rlabel">🥉 Semifinalist' + (semiLosers.length > 1 ? 's' : '') + '</div>' +
        '<div class="rvalue">' + (semiLosers.length ? semiLosers.map(id => escapeHtml(teamName(id))).join(' · ') : (sfMatches.length ? 'TBD' : '—')) + '</div>' +
      '</div>'
    ));
    return wrap;
  }

  function renderErrorBanner(){
    return el('<div class="error-banner">⚠️ ' + escapeHtml(storageError) + '</div>');
  }

  function renderFileProtocolWarning(){
    return el(
      '<div class="error-banner">⚠️ This page is open as a local file (the address bar starts with "file://"). ' +
      'Any link you copy right now — including Umpire links and the main share link — will only open on THIS ' +
      'computer, not on players\' or umpires\' phones. Open the page from its hosted https:// address (e.g. your ' +
      'GitHub Pages link) instead, and generate/copy links from that tab.</div>'
    );
  }

  function renderRecoveryCard(){
    const card = el(
      '<div class="error-banner">' +
        '<div style="margin-bottom:10px;">⚠️ ' + escapeHtml(storageError) + ' Nothing can be added or saved until this is fixed.</div>' +
        '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
          '<button class="small gold" id="recover-fresh-btn">Start new shared storage</button>' +
          '<button class="small" id="recover-import-btn">Restore from a backup file</button>' +
        '</div>' +
        '<input type="file" accept="application/json,.json" id="recover-import-input" style="display:none;">' +
        '<div class="toss-note" style="margin-top:8px;">"Start new shared storage" creates a brand-new link — you\'ll need to re-share it with players. "Restore from a backup file" re-loads whatever you last exported using the Backup button (admin mode), and also creates a new link seeded with that data.</div>' +
      '</div>'
    );
    card.querySelector('#recover-fresh-btn').onclick = async () => {
      if(!confirm('This creates a brand-new shared link for this tournament — you will need to re-share the new link with players. Continue?')) return;
      await recoverStorage(defaultState());
    };
    const fileInput = card.querySelector('#recover-import-input');
    card.querySelector('#recover-import-btn').onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const file = fileInput.files[0];
      if(!file) return;
      importBackupFile(file, async (err, data) => {
        if(err){ alert(err.message); return; }
        if(!confirm('Restore tournament data from this backup file? This also creates a new shared link to re-share with players.')) return;
        await recoverStorage(data);
      });
    };
    return card;
  }

  function renderShareBar(){
    const bar = el(
      '<div class="share-bar">' +
        '<span>🔗 Share this exact link so everyone sees the same tournament:</span>' +
        '<span class="link-txt">' + escapeHtml(shareableLink()) + '</span>' +
      '</div>'
    );
    const refreshBtn = el('<button class="small">↻ Refresh scores</button>');
    refreshBtn.onclick = async () => {
      refreshBtn.textContent = 'Refreshing…';
      await loadState();
      render();
    };
    bar.appendChild(refreshBtn);
    const copyBtn = el('<button class="small gold">Copy link</button>');
    copyBtn.onclick = async () => {
      try{
        await navigator.clipboard.writeText(shareableLink());
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1500);
      }catch(e){
        alert('Could not copy automatically. Copy this link manually:\n' + shareableLink());
      }
    };
    bar.appendChild(copyBtn);
    return bar;
  }

  function renderFootnote(){
    return el(
      '<div class="footnote">Share the exact link above (including the code after #) with players so they can follow the draw, fixtures and results live — no account or sign-in needed. Only the admin (PIN-protected) can add teams, run the toss and enter scores; that PIN is a light gate for convenience, not strong security. Data is stored via a free public JSON storage service — anyone with this exact link can read it, so avoid putting sensitive personal details in team names or member lists. As an admin, use the ⬇ Backup button occasionally to download a JSON snapshot — if the storage service ever loses this link\'s data again, use ⬆ Restore (or the recovery banner that appears automatically) to get back up and running.</div>'
    );
  }

  function escapeHtml(s){
    if(s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Auto-refresh: lets an admin watching on a laptop see an umpire's score
  // taps (or another admin's changes) show up without hitting Refresh. Runs
  // for the admin view and umpire views only (not for anonymous viewers, who
  // use the manual Refresh button) to keep request volume sane across a
  // whole tournament day with several courts running at once.
  //
  // The interval is self-adjusting rather than fixed: it starts at 15s,
  // doubles (up to 2 minutes) any time it sees a 429 "busy" response, and
  // resets to 15s the moment a request succeeds cleanly. It also shares one
  // cooldown flag with saves (see noteRateLimited/inCooldown above) — if a
  // live-scoring save just got rate-limited, the poll backs off too instead
  // of piling more requests on top while the storage service is struggling.
  // Each poll is a single bare attempt (no retries) since a skipped cycle
  // just means trying again next time — not worth amplifying load over.
  function hasOpenEditPanel(){
    return !!document.querySelector('.score-edit, .coin-wrap, .ump-link-box');
  }

  const POLL_BASE_MS = 15000, POLL_MAX_MS = 120000;
  let pollDelay = POLL_BASE_MS;
  let pollTimer = null;

  async function pollOnce(){
    if(!storeRef) return;
    try{
      const backend = BACKENDS[storeRef.backend];
      const res = await fetch(backend.itemUrl(storeRef.id) + '?_=' + Date.now(), { headers: {'Accept':'application/json'}, cache: 'no-store' });
      if(res.status === 429){ noteRateLimited(); return; }
      if(res.status === 404){ storageStatus = 'missing'; storageError = 'This link\'s storage no longer exists.'; return; }
      if(!res.ok) return; // transient hiccup — next poll will retry
      state = Object.assign(defaultState(), await res.json());
      storageError = null;
      if(storageStatus !== 'missing') storageStatus = 'ok';
    }catch(e){ /* network blip — next poll will retry */ }
  }

  function scheduleNextPoll(){
    const jitter = Math.floor(Math.random() * 4000);
    pollTimer = setTimeout(pollTick, pollDelay + jitter);
  }

  async function pollTick(){
    const shouldPoll = !document.hidden
      && (isAdmin || scopedMatchId)          // spectators use the manual Refresh button
      && !hasOpenEditPanel()                 // never yank an in-progress edit out from under someone
      && !Object.keys(saveDebounceTimers).length // a save is already about to fetch fresh data
      && !inCooldown();
    if(!shouldPoll){ scheduleNextPoll(); return; }

    const before = JSON.stringify(state) + '|' + storageError;
    await pollOnce();
    if(inCooldown()){
      pollDelay = Math.min(pollDelay * 2, POLL_MAX_MS);
    } else {
      pollDelay = POLL_BASE_MS;
      const after = JSON.stringify(state) + '|' + storageError;
      if(after !== before) render();
    }
    scheduleNextPoll();
  }

  function startAutoRefresh(){
    if(pollTimer) return;
    scheduleNextPoll();
  }

  async function init(){
    scopedMatchId = getScopedMatchIdFromHash();
    await loadState();
    render();
    startAutoRefresh();
  }
  init();
})();
</script>
